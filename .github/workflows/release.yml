# Runs when a version tag is pushed (see "Releasing" in README.md). In order:
# the tag must match the version in the code, the checks must pass, the image is
# built and pushed to ghcr.io, and a GitHub Release is created.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Nothing by default; each job below is given exactly what it needs.
permissions: {}

jobs:
  version:
    name: Tag matches the code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/version.py check "$GITHUB_REF_NAME"

  checks:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  image:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      push: true

  release:
    name: GitHub Release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$(printf '%s\n' \
            'Docker image for linux/amd64 and linux/arm64:' \
            '' \
            '```sh' \
            "docker pull ghcr.io/sequoiap/grocy-assistant:$version" \
            '```')
          flags=()
          if [[ $version == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "$notes" --generate-notes "${flags[@]}"
