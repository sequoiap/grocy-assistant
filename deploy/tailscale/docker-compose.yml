# Grocy Assistant on your tailnet with a real HTTPS certificate, no open ports.
#
#   1. In the Tailscale admin console enable MagicDNS and HTTPS certificates.
#   2. Create an auth key (Settings > Keys) and put it in a .env file next to this
#      one, along with your Grocy's address:
#        TS_AUTHKEY=tskey-auth-...
#        GA_GROCY_URL=https://grocy.<your-tailnet>.ts.net
#   3. cd deploy/tailscale && docker compose up -d
#   4. Open https://grocy-assistant.<your-tailnet>.ts.net on any device in the tailnet.
#
# That runs the published image; add --build to build from this checkout instead.
# To update to the newest release: docker compose pull && docker compose up -d
#
# Already running Tailscale on the host? Skip this file: use the top-level
# docker-compose.yml and run `tailscale serve --bg 8080` on the host instead.
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: grocy-assistant   # becomes the machine name in your tailnet
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?put TS_AUTHKEY=tskey-auth-... in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro

  grocy-assistant:
    # Published for amd64 and arm64 with every release. To stay on one release,
    # replace "latest" with its version, e.g. 0.1.0 (or 0.1 for the newest 0.1.x).
    image: ghcr.io/sequoiap/grocy-assistant:latest
    build: ../..
    restart: unless-stopped
    # Share the Tailscale container's network so Serve can reach 127.0.0.1:8080,
    # and so the app can reach a Grocy that lives on the tailnet too.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - grocy_assistant_data:/data
    environment:
      # Required: the address of your Grocy, as reachable from inside this
      # container (not "localhost" unless Grocy shares its network).
      GA_GROCY_URL: ${GA_GROCY_URL:?set GA_GROCY_URL to the address of your Grocy, e.g. in .env}
      GA_SECRET_KEY: ${GA_SECRET_KEY:-}

volumes:
  tailscale_state:
  grocy_assistant_data:
